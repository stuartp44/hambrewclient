name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    name: Validate HACS
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    name: Validate with hassfest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  validate-manifest:
    runs-on: ubuntu-latest
    name: Validate manifest.json
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate manifest structure
        run: |
          python -c "
          import json
          import sys
          
          with open('custom_components/minibrew/manifest.json', 'r') as f:
              manifest = json.load(f)
          
          required_fields = ['domain', 'name', 'version', 'documentation', 'codeowners', 'requirements']
          
          missing = [field for field in required_fields if field not in manifest]
          
          if missing:
              print(f'Missing required fields: {missing}')
              sys.exit(1)
          
          print('Manifest validation passed')
          "

  validate-commits:
    runs-on: ubuntu-latest
    name: Validate Commits
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Validate current commit
        run: echo "${{ github.event.head_commit.message }}" | commitlint

  release-please:
    runs-on: ubuntu-latest
    needs: [validate-hacs, validate-hassfest, validate-manifest, validate-commits]

    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
